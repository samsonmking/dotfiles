onboarding = false

[update]
version_check = false
manifest_check = false

[terminal]
new_cwd = "follow"

[keys]
prefix = "alt+space"
reload_config = "prefix+r"
split_vertical = "prefix+%"
split_horizontal = 'prefix+"'
previous_tab = ["alt+h", "alt+o", "prefix+p"]
next_tab = ["alt+l", "alt+i", "prefix+n"]
switch_tab = "alt+1..9"
move_tab_previous = "alt+shift+h"
move_tab_next = "alt+shift+l"
swap_pane_left = ["prefix+shift+h", "prefix+left"]
swap_pane_down = ["prefix+shift+j", "prefix+down"]
swap_pane_up = ["prefix+shift+k", "prefix+up"]
swap_pane_right = ["prefix+shift+l", "prefix+right"]
resize_pane_left = "ctrl+alt+h"
resize_pane_down = "ctrl+alt+j"
resize_pane_up = "ctrl+alt+k"
resize_pane_right = "ctrl+alt+l"

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = 'sh "$HOME/.config/herdr/navigate.sh" left'
description = "Navigate left across Neovim and Herdr"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = 'sh "$HOME/.config/herdr/navigate.sh" down'
description = "Navigate down across Neovim and Herdr"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = 'sh "$HOME/.config/herdr/navigate.sh" up'
description = "Navigate up across Neovim and Herdr"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = 'sh "$HOME/.config/herdr/navigate.sh" right'
description = "Navigate right across Neovim and Herdr"

[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = '"$HERDR_BIN_PATH" pane send-keys "$HERDR_ACTIVE_PANE_ID" ctrl+l'
description = "Clear shell screen"
